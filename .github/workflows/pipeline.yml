name: Pipeline

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  analyse:
    runs-on: ubuntu-latest

    name: PHPStan

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run PHPStan analysis
        run: composer analyse

  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: [ '8.3', '8.4', '8.5' ]

    name: Tests (PHP ${{ matrix.php }})

    # Same databases as docker/docker-compose.yml; the schemas are loaded once the code is checked out
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: demo
          MYSQL_DATABASE: demo
          MYSQL_USER: demo
          MYSQL_PASSWORD: demo
        ports:
          - 3306:3306
        # TCP only: the temporary server started during initialization does not listen on it
        options: >-
          --health-cmd "mysqladmin ping --protocol=tcp -h 127.0.0.1 -uroot -pdemo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30

      pgsql:
        image: postgres:14
        env:
          POSTGRES_USER: demo
          POSTGRES_PASSWORD: demo
          POSTGRES_DB: demo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U demo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30

      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: Demo@12345
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Demo@12345 -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 20s

    env:
      # Fail, instead of skipping, the integration tests when a database or extension is missing
      DB_REQUIRED: 1

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Load the demo schemas
        run: |
          docker exec -i ${{ job.services.mysql.id }} mysql -uroot -pdemo demo < docker/mysql/init.sql
          docker exec -i ${{ job.services.pgsql.id }} psql -U demo -d demo -v ON_ERROR_STOP=1 -q < docker/pgsql/init.sql
          docker cp docker/sqlsrv/init.sql ${{ job.services.mssql.id }}:/tmp/init.sql
          docker exec ${{ job.services.mssql.id }} /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Demo@12345 -C -b -Q "CREATE DATABASE demo"
          docker exec ${{ job.services.mssql.id }} /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Demo@12345 -C -b -d demo -i /tmp/init.sql

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, pdo_pgsql, pdo_sqlsrv
          coverage: xdebug

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run test suite
        run: composer test

      - name: Run mutation tests
        run: composer test:mutate
